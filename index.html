<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Mujer con Chalina — V2</title>
<meta name="description" content="Prototipo interactivo de La Mujer con Chalina. Una experiencia narrativa para conservar recuerdos mediante una representación artística.">
<meta name="theme-color" content="#743d49">
<style>
:root{--wine:#743d49;--wine2:#9b6870;--cream:#faf7f2;--ink:#302b2b;--muted:#746b68;--line:#e7ddd7;--card:#fffdfa}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 Georgia,serif}.wrap{max-width:760px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;font:13px Arial,sans-serif;color:var(--muted)}.brand{font:700 13px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--wine)}.progress{height:4px;background:#eadfd9;border-radius:10px;overflow:hidden;margin:14px 0 28px}.bar{height:100%;width:8%;background:var(--wine);transition:width .3s}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,34px);box-shadow:0 10px 35px #5c3b2410}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--wine2)}h1,h2{line-height:1.18;margin:.5em 0}h1{font-size:clamp(30px,6vw,46px)}h2{font-size:clamp(24px,5vw,32px)}p{margin:12px 0}.story{font-size:18px}.woman{color:var(--wine);font-weight:bold}.muted{color:var(--muted);font:13px/1.5 Arial,sans-serif}.choices{display:grid;gap:10px;margin:20px 0}.choice{display:block;border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;background:#fff;font:15px Arial,sans-serif}.choice:has(input:checked){border-color:var(--wine);background:#f8eff0}.choice input{margin-right:9px;accent-color:var(--wine)}input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;font:15px Arial,sans-serif;background:white;color:var(--ink)}textarea{min-height:100px;resize:vertical}.field{margin:16px 0}.field label{display:block;font:700 13px Arial,sans-serif;margin-bottom:7px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button{border:0;border-radius:999px;padding:13px 21px;background:var(--wine);color:white;font:700 14px Arial,sans-serif;cursor:pointer}button.secondary{background:#eee5e1;color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.scene{background:linear-gradient(135deg,#ead8c8,#f8eee3 55%,#d9c5ad);border-radius:14px;padding:25px;margin:18px 0;color:#51403b}.scene strong{color:#6d3542}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.tile{background:#f8f3ee;border-radius:10px;padding:12px}.tile small{display:block;color:var(--muted);font:11px Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}.tile b{font:14px Arial,sans-serif}.hidden{display:none!important}.notice{padding:12px 14px;border-left:3px solid var(--wine2);background:#f7f0ec;color:#655b57;font:13px/1.5 Arial,sans-serif;margin:16px 0}.footer{font:12px Arial,sans-serif;color:var(--muted);text-align:center;margin-top:22px}@media(max-width:520px){.summary{grid-template-columns:1fr}.top{align-items:flex-start}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">La Mujer con Chalina</div><div>Prototipo V2 · Desarrollo experimental</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="panel" id="app" aria-live="polite"></section>
<div class="footer">Prototipo de evaluación. No es un servicio terapéutico ni almacena recuerdos o fotografías.</div>
</main>
<script>
const app=document.getElementById('app'),bar=document.getElementById('bar');let step=0;const data={path:'',memory:'',person:'',hair:'',glasses:'',frequency:'',place:'',setting:'',otherSetting:'',feeling:'',style:'',ageMan:'',ageOlder:'',ageYounger:'',feedback:{}};
function progress(n){bar.style.width=Math.max(8,Math.round(n/11*100))+'%'}
function render(){progress(step);const pages=[
`<div class="eyebrow">Una experiencia narrativa interactiva</div><h1>Hay recuerdos que merecen permanecer.</h1><p class="story">La Mujer con Chalina guarda historias en los pliegues de su tela. No conoce la tuya todavía, pero quiere escucharla y ayudarte a convertirla en una representación artística.</p><div class="scene"><p class="woman">La Mujer con Chalina:</p><p>—No necesitas contarme todo. Comparte solamente aquello que te sientas cómodo recordando. Podemos detenernos cuando quieras.</p></div><div class="notice">Participación voluntaria. Evita compartir nombres completos, direcciones exactas u otros datos privados. Esta versión es un prototipo y la imagen final es una demostración conceptual.</div><div class="actions"><button onclick="next()">Comenzar</button></div>`,
`<div class="eyebrow">Escena 1 · El recuerdo</div><h2>¿Qué recuerdo te gustaría conservar de una persona que ya no está?</h2><p>Piensa en alguien que haya fallecido y cuyo recuerdo sea importante para ti. Puede ser un momento que compartieron, una conversación, una actividad cotidiana o una pequeña costumbre que recuerdes con cariño. Comparte solo lo que te sientas cómodo contando.</p><div class="field"><textarea id="memory" placeholder="Cuéntame el recuerdo con tus propias palabras…">${esc(data.memory)}</textarea></div><div class="actions"><button onclick="saveText('memory');next()">Continuar</button></div>`,
`<div class="eyebrow">Escena 2 · La persona</div><h2>¿Qué detalle de esa persona recuerdas con mayor claridad?</h2><div class="field"><input id="person" value="${esc(data.person)}" placeholder="Ej. su cabello, su sonrisa, su manera de caminar"></div><div class="actions"><button onclick="saveText('person');next()">Continuar</button></div>`,
`<div class="eyebrow">Escena 3 · Los detalles</div><h2>¿Recuerdas algún rasgo físico que quisieras incluir?</h2><div class="field"><label>Cabello u otro rasgo</label><input id="hair" value="${esc(data.hair)}" placeholder="Ej. cabello blanco"></div><div class="field"><label>Lentes u otro accesorio (si corresponde)</label><input id="glasses" value="${esc(data.glasses)}" placeholder="Ej. lentes cuadrados / No recuerdo"></div><div class="actions"><button onclick="saveText('hair');saveText('glasses');next()">Continuar</button></div>`,
`<div class="eyebrow">Escena 4 · El contexto</div><h2>¿Qué ocurría en ese momento?</h2><p>Cuéntame la acción y quiénes estaban presentes. Estos detalles ayudan a representar ese instante, no solo a la persona.</p><div class="field"><textarea id="frequency" placeholder="Ej. lo veía llevando a sus dos hijas al colegio…">${esc(data.frequency)}</textarea></div><div class="actions"><button onclick="saveText('frequency');next()">Continuar</button></div>`,
`<div class="eyebrow">Escena 5 · La localidad</div><h2>¿En qué ciudad, pueblo o localidad ocurrió ese recuerdo?</h2><p>Indica el lugar general donde sucedió. No necesitas compartir una dirección exacta.</p><div class="field"><input id="place" value="${esc(data.place)}" placeholder="Ej. Lima, Perú / Arequipa / un pueblo de Cusco"></div><div class="actions"><button onclick="next()">Continuar</button></div>`,
`<div class="eyebrow">Escena 6 · El entorno</div><h2>¿Cómo era el entorno de ese lugar?</h2><p>Ahora describe el tipo de espacio donde ocurrió la escena. Por ejemplo, si era cerca de un colegio, una calle residencial o una avenida.</p><div class="choices">${settingOptions()}</div>${data.setting==='Otro entorno'?`<div class="field"><label>Cuéntame cómo era ese entorno</label><input id="otherSetting" value="${esc(data.otherSetting)}" placeholder="Ej. un mercado, una plaza, una estación..."></div>`:''}<div class="actions"><button onclick="next()">Continuar</button></div>` ,
`<div class="eyebrow">Escena 7 · La emoción</div><h2>¿Qué sensación te produce recordar ese momento?</h2><div class="choices">${opts('feeling',['Nostalgia','Tranquilidad','Alegría','Tristeza','Una sensación difícil de explicar','No me genera una emoción particular'])}</div><div class="actions"><button onclick="next()">Continuar</button></div>`,
`<div class="eyebrow">Escena 8 · La forma del recuerdo</div><h2>¿Qué estilo artístico te gustaría para la representación?</h2><div class="choices">${opts('style',['Artística y nostálgica, como una pintura','Cinematográfica y realista, como una escena de película','Sutil y simbólica'])}</div><div class="actions"><button onclick="next()">Continuar</button></div>`,
`<div class="eyebrow">Escena 9 · La fidelidad del recuerdo</div><h2>Antes de crear la imagen, revisemos las edades.</h2><p>Solo responde si recuerdas aproximadamente las edades. Puedes indicar “no recuerdo”.</p><div class="field"><label>Edad aproximada de la persona recordada</label><input id="ageMan" value="${esc(data.ageMan)}" placeholder="Ej. 45–50 años / No recuerdo"></div><div class="field"><label>Edad aproximada de otras personas importantes en la escena</label><input id="ageOlder" value="${esc(data.ageOlder)}" placeholder="Ej. hija mayor: 16 años"></div><div class="field"><label>Otra edad, si corresponde</label><input id="ageYounger" value="${esc(data.ageYounger)}" placeholder="Ej. hija menor: 13 años"></div><div class="actions"><button onclick="saveText('ageMan');saveText('ageOlder');saveText('ageYounger');next()">Revisar mi recuerdo</button></div>`,
`<div class="eyebrow">Escena 10 · Revisión previa</div><h2>Así entendimos tu recuerdo</h2><p>Revisa los datos. La IA no debe añadir hechos que no hayas contado. Los detalles desconocidos deben quedar sin especificar.</p><div class="summary">${summary()}</div><div class="notice">La referencia visual puede incluir decisiones artísticas, pero no debe presentarlas como hechos confirmados. La Mujer con Chalina no aparecerá en la obra final.</div><div class="actions"><button onclick="next()">Confirmar composición</button><button class="secondary" onclick="step=1;render()">Revisar mis respuestas</button></div>`,
`<div class="eyebrow">Escena 11 · La chalina</div><h2>Tu recuerdo tiene una forma propia.</h2><div class="scene"><p class="woman">La Mujer con Chalina:</p><p>—He reunido los detalles que decidiste compartir. La obra debe representar ese momento y respetar lo que recuerdas. No voy a inventar aquello que no sabes.</p></div><div class="notice"><b>Demostración visual:</b> en esta V2 no se genera automáticamente una imagen personalizada. Esta etapa representa cómo se presentaría la aprobación antes de la generación definitiva.</div><div class="actions"><button onclick="finish()">Finalizar experiencia</button></div>`
 ];app.innerHTML=pages[step]||pages[0];if(step>0)app.insertAdjacentHTML('afterbegin','<div class="actions" style="margin-top:0;margin-bottom:16px"><button class="secondary" onclick="back()">← Volver</button></div>')}
function opts(key,values){return values.map(v=>`<label class="choice"><input type="radio" name="${key}" value="${v.replaceAll('"','&quot;')}" ${data[key]===v?'checked':''} onchange="data['${key}']=this.value">${v}</label>`).join('')}
function settingOptions(){return opts('setting',['Cerca de un colegio','Una calle residencial con parques y jardines','Una avenida concurrida','Un entorno rural o natural','No recuerdo el entorno','Otro entorno']).replace(/onchange="data\['setting'\]=this.value"/g,'onchange="setSetting(this.value)"')}
function setSetting(value){data.setting=value;if(value!=='Otro entorno')data.otherSetting='';render()}
function saveText(k){const e=document.getElementById(k);if(e)data[k]=e.value.trim()}
function saveCurrent(){['memory','person','hair','glasses','frequency','place','otherSetting','ageMan','ageOlder','ageYounger'].forEach(saveText)}
function next(){saveCurrent();step=Math.min(step+1,11);render()}
function back(){saveCurrent();step=Math.max(step-1,0);render()}
function summary(){const rows=[['Recuerdo',data.memory],['Persona',data.person],['Rasgos', [data.hair,data.glasses].filter(Boolean).join('; ')],['Acción y personas',data.frequency],['Localidad',data.place],['Entorno',data.setting==='Otro entorno'&&data.otherSetting?data.otherSetting:data.setting],['Emoción',data.feeling],['Estilo',data.style],['Edades',[data.ageMan,data.ageOlder,data.ageYounger].filter(Boolean).join('; ')]];return rows.map(([a,b])=>`<div class="tile"><small>${a}</small><b>${esc(b||'No especificado')}</b></div>`).join('')}
function finish(){app.innerHTML=`<div class="eyebrow">Cierre · Gracias por compartir</div><h2>Gracias por acompañarnos.</h2><p>Has llegado al final de esta experiencia. La evaluación se realizará mediante un formulario independiente.</p><div class="scene"><p class="woman">La Mujer con Chalina:</p><p>—Gracias por confiarme este recuerdo. Lo que compartiste merece ser tratado con cuidado.</p></div><div class="notice">Puedes compartir tu opinión mediante el formulario de evaluación.</div><div class="actions"><button onclick="openFeedback()">Compartir mi opinión</button><button class="secondary" onclick="location.reload()">Volver al inicio</button></div>`;bar.style.width='100%'}
function openFeedback(){window.open("https://forms.gle/wQmvckCyQbntAJNi7","_blank","noopener,noreferrer")}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
